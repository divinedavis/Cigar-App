name: Cigar watch

# Diff cigarsinternational's sitemap against the Supabase URL snapshot and
# scrape any new products. Runs weekly; can also be triggered by hand.
#
# GitHub Actions cron is always UTC — there is no timezone option. 10:00 UTC
# is 06:00 EDT from March to November and 05:00 EST from November to March,
# which is close enough to "Monday morning" for a catalog delta job.
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Pin exact versions so a typosquat or a compromised newer
        # release can't run in a job that holds SUPABASE_SERVICE_KEY.
        run: pip install --quiet curl-cffi==0.15.0 beautifulsoup4==4.15.0

      - name: Run watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: cigars
        run: python3 scripts/scrape_cigars.py watch
